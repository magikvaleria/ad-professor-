<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reading Notes</title>
    <meta name="description" content="Quotes and reflections from my reading, as flippable cards by topic." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" />
    <style>
      :root {
        --paper: #f4f1ea;
        --card: #fffdf8;
        --card-back: #2c2722;
        --ink: #23201b;
        --soft: #6b655c;
        --accent: #6a5b3e;
        --rule: #e2ddd1;
      }
      * { box-sizing: border-box; }
      html { background: var(--paper); }
      body {
        margin: 0;
        color: var(--ink);
        font-family: "EB Garamond", Georgia, serif;
        line-height: 1.6;
      }
      .wrap { max-width: 64rem; margin: 0 auto; padding: 4.5rem 1.25rem 7rem; }

      header.masthead { text-align: center; margin-bottom: 2.5rem; }
      .kicker {
        font-family: "Inter", sans-serif;
        font-size: 0.72rem; letter-spacing: 0.24em; text-transform: uppercase;
        color: var(--accent); margin: 0 0 0.6rem;
      }
      h1.site { font-size: 2.7rem; font-weight: 500; margin: 0; line-height: 1.1; }
      .tagline { color: var(--soft); font-style: italic; margin: 0.6rem 0 0; }

      .filters {
        display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem;
        margin: 0 auto 3rem; max-width: 52rem;
      }
      .chip {
        font-family: "Inter", sans-serif; font-size: 0.78rem;
        padding: 0.4rem 0.85rem; border-radius: 999px; cursor: pointer;
        border: 1px solid var(--rule); background: transparent; color: var(--soft);
        transition: all 0.18s ease;
      }
      .chip:hover { border-color: var(--accent); color: var(--accent); }
      .chip.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }

      .book { margin-bottom: 3.5rem; }
      .book-title {
        font-size: 1.05rem; font-weight: 500; text-align: center; color: var(--soft);
        font-style: italic; margin: 0 0 1.75rem;
      }
      .book-author { display: block; font-size: 0.85rem; font-style: normal; }

      .grid {
        display: grid; gap: 1.1rem;
        grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr));
      }

      .card {
        font: inherit; text-align: left; border: none; background: none; padding: 0;
        cursor: pointer; perspective: 1200px; min-height: 13rem;
      }
      .card.is-hidden { display: none; }
      .card-inner {
        display: grid; height: 100%;
        transition: transform 0.55s cubic-bezier(0.2, 0.7, 0.2, 1);
        transform-style: preserve-3d;
      }
      .card.is-flipped .card-inner { transform: rotateY(180deg); }
      .face {
        grid-area: 1 / 1; height: 100%;
        -webkit-backface-visibility: hidden; backface-visibility: hidden;
        border-radius: 14px; padding: 1.35rem 1.4rem;
        display: flex; flex-direction: column;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05), 0 8px 24px rgba(40,32,20,0.07);
      }
      .front { background: var(--card); border: 1px solid var(--rule); }
      .back { background: var(--card-back); color: #f4f1ea; transform: rotateY(180deg); }

      .tag {
        font-family: "Inter", sans-serif; font-size: 0.66rem; letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--accent); margin-bottom: 0.7rem;
      }
      .back .tag { color: #c9b890; }
      .quote { font-size: 1.12rem; font-style: italic; line-height: 1.5; }
      .hint {
        font-family: "Inter", sans-serif; font-size: 0.66rem; letter-spacing: 0.1em;
        text-transform: uppercase; color: var(--soft); margin-top: auto; padding-top: 0.9rem;
      }
      .back-label {
        font-family: "Inter", sans-serif; font-size: 0.66rem; letter-spacing: 0.12em;
        text-transform: uppercase; color: #c9b890; margin-bottom: 0.4rem;
      }
      .note { margin: 0; font-style: italic; font-size: 1.02rem; }
      .attribution { margin: auto 0 0; font-style: italic; font-size: 1.05rem; }
      .byline { display: block; font-size: 0.85rem; color: #c9b890; font-style: normal; margin-top: 0.2rem; }

      footer {
        margin-top: 4rem; text-align: center;
        color: var(--soft); font-size: 0.85rem; font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="masthead">
        <p class="kicker">Reading Notes</p>
        <h1 class="site">Quotes &amp; Reflections</h1>
        <p class="tagline">Tap a card to flip it. Filter by topic above.</p>
      </header>

      <div class="filters">
        <button class="chip is-active" data-filter="all">All</button>
        <button class="chip" data-filter="on-rising-in-consciousness">On rising in consciousness</button>
        <button class="chip" data-filter="on-masters-the-master-is-within">On masters — the master is within</button>
        <button class="chip" data-filter="on-claiming-i-am-christ">On claiming &quot;I am Christ&quot;</button>
        <button class="chip" data-filter="on-consciousness-as-god">On consciousness as God</button>
        <button class="chip" data-filter="on-rebirth">On rebirth</button>
        <button class="chip" data-filter="on-escaping-your-present-conception-of-yourself">On escaping your present conception of yourself</button>
        <button class="chip" data-filter="on-the-practice-feeling-i-am">On the practice — feeling &quot;I am&quot;</button>
        <button class="chip" data-filter="on-the-floating-state">On the floating state</button>
        <button class="chip" data-filter="on-self-valuation-giants-and-grasshoppers">On self-valuation — giants and grasshoppers</button>
        <button class="chip" data-filter="on-consciousness-as-the-only-savior">On consciousness as the only savior</button>
        <button class="chip" data-filter="on-the-vine-and-the-branches">On the vine and the branches</button>
        <button class="chip" data-filter="on-the-claim-i-am-that">On the claim — &quot;I am that&quot;</button>
        <button class="chip" data-filter="scriptures-to-meditate-on">Scriptures to meditate on</button>
        <button class="chip" data-filter="on-leaving-all-and-following">On leaving all and following</button>
        <button class="chip" data-filter="concept-application">Concept → Application</button>
        <button class="chip" data-filter="daily-practice">Daily practice</button>
      </div>

    <section class="book">
      <h2 class="book-title">Your Faith Is Your Fortune<span class="book-author">Neville Goddard</span></h2>
      <div class="grid">
        <button class="card" data-topic="on-rising-in-consciousness" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On rising in consciousness</span>
            <span class="quote">To rise in consciousness to the level of the thing desired, and to remain there until such a level becomes your nature, is the way of all seeming miracles.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On rising in consciousness</span>
            <p class="attribution">Your Faith Is Your Fortune<span class="byline">Neville Goddard</span></p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-rising-in-consciousness" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On rising in consciousness</span>
            <span class="quote">The rising from one level of consciousness to another is the only ascension you will ever experience. No man can lead you to the level you desire. The power to ascend is within yourself — it is your consciousness.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On rising in consciousness</span>
            <p class="attribution">Your Faith Is Your Fortune<span class="byline">Neville Goddard</span></p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-rising-in-consciousness" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On rising in consciousness</span>
            <span class="quote">You appropriate the consciousness of the level you desire to express by claiming that you are now expressing such a level. That is the ascension.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On rising in consciousness</span>
            <p class="attribution">Your Faith Is Your Fortune<span class="byline">Neville Goddard</span></p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-masters-the-master-is-within" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On masters — the master is within</span>
            <span class="quote">Turn from the human superstition of ascension, with its belief in masters who will lift you to the goal. The only everlasting master is within yourself — your own consciousness, your source.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On masters — the master is within</span>
            <span class="back-label">My note</span><p class="note">I used to believe in masters — but no one else lifts you up; the only everlasting master is within. And it never exhausts our capacity to ascend, which is why the mentor relationship is never-ending: we're always evolving, evolving, evolving, ascending to new layers.</p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-masters-the-master-is-within" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On masters — the master is within</span>
            <span class="quote">You claim yourself to be that which you want to be, and that you shall be — not because of any master who gave it unto you, but because you have recognized me, your own self, to be that. I will give it unto you, for I am all things to all.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On masters — the master is within</span>
            <p class="attribution">Your Faith Is Your Fortune<span class="byline">Neville Goddard</span></p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-masters-the-master-is-within" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On masters — the master is within</span>
            <span class="quote">Your belief in masters is a confession of your slavery. Only slaves have masters. Change your conception of yourself, and you will, without the aid of masters or anyone else, automatically transform your world to conform to your changed conception of yourself.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On masters — the master is within</span>
            <span class="back-label">My note</span><p class="note">This is exactly how it felt with the mentorship — like I was asleep, depending on it for me to do well. But no — everything I need is within me.</p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-claiming-i-am-christ" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On claiming &quot;I am Christ&quot;</span>
            <span class="quote">You are constantly drawing to yourself that which you are conscious of being. Change your conception of yourself from that of the slave to that of Christ. Do not be embarrassed to make this claim — only as you claim &quot;I am Christ&quot; will you do the works of Christ.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On claiming &quot;I am Christ&quot;</span>
            <p class="attribution">Your Faith Is Your Fortune<span class="byline">Neville Goddard</span></p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-claiming-i-am-christ" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On claiming &quot;I am Christ&quot;</span>
            <span class="quote">Your true self is not interested in man's opinion. All its interest lies in your conviction of yourself. What do you say of the I AM within you? Can you answer and say, &quot;I am Christ&quot;? Your answer — your degree of understanding — will determine the place you will occupy in life.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On claiming &quot;I am Christ&quot;</span>
            <p class="attribution">Your Faith Is Your Fortune<span class="byline">Neville Goddard</span></p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-claiming-i-am-christ" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On claiming &quot;I am Christ&quot;</span>
            <span class="quote">Do you believe yourself to be a man of a certain family, race, nation? If you honestly believe this of yourself, then life — your true self — will cause these conceptions to appear in your world, and you will live with them as though they were real.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On claiming &quot;I am Christ&quot;</span>
            <p class="attribution">Your Faith Is Your Fortune<span class="byline">Neville Goddard</span></p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-consciousness-as-god" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On consciousness as God</span>
            <span class="quote">Consciousness is God, and that which is conscious of being is the son bearing witness of God, the Father. The conceiver and the conception are one, but the conceiver is greater than his conception.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On consciousness as God</span>
            <p class="attribution">Your Faith Is Your Fortune<span class="byline">Neville Goddard</span></p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-consciousness-as-god" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On consciousness as God</span>
            <span class="quote">The consciousness of being is not dependent upon being anything.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On consciousness as God</span>
            <span class="back-label">My note</span><p class="note">I'm thinking the consciousness of being is the same thing as consciousness itself — which is God.</p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-rebirth" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On rebirth</span>
            <span class="quote">If you are dissatisfied with your present expression of life, then you must be born again. Rebirth is the dropping of that level with which you are dissatisfied, and rising to that level of consciousness which you desire to express.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On rebirth</span>
            <p class="attribution">Your Faith Is Your Fortune<span class="byline">Neville Goddard</span></p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-rebirth" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On rebirth</span>
            <span class="quote">But every level of consciousness expresses itself automatically.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On rebirth</span>
            <p class="attribution">Your Faith Is Your Fortune<span class="byline">Neville Goddard</span></p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-rebirth" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On rebirth</span>
            <span class="quote">In order to rise to the level you are not now expressing, you must completely drop the consciousness with which you are now identified. Until your present consciousness drops, you will not be able to rise to another level.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On rebirth</span>
            <p class="attribution">Your Faith Is Your Fortune<span class="byline">Neville Goddard</span></p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-rebirth" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On rebirth</span>
            <span class="quote">You will never transcend your present accomplishments through sacrifice and struggle. Your present level of consciousness will only be transcended as you drop the present state and rise to a higher level.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On rebirth</span>
            <p class="attribution">Your Faith Is Your Fortune<span class="byline">Neville Goddard</span></p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-rebirth" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On rebirth</span>
            <span class="quote">You rise to a higher level of consciousness by taking your attention away from your present limitations and placing it upon that which you desire to be.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On rebirth</span>
            <p class="attribution">Your Faith Is Your Fortune<span class="byline">Neville Goddard</span></p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-rebirth" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On rebirth</span>
            <span class="quote">Caveat: Do not attempt this through daydreaming or wishful thinking, but in a positive manner. Claim yourself to be the thing desired — &quot;I am that.&quot; No sacrifice, no diet, no human tricks. All that is asked of you is to accept your desire.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On rebirth</span>
            <p class="attribution">Your Faith Is Your Fortune<span class="byline">Neville Goddard</span></p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-escaping-your-present-conception-of-yourself" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On escaping your present conception of yourself</span>
            <span class="quote">You are invited to escape from your present conception of yourself, with all its limitations, and the Lord with whom you are to be present is your awareness of being.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On escaping your present conception of yourself</span>
            <p class="attribution">Your Faith Is Your Fortune<span class="byline">Neville Goddard</span></p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-the-practice-feeling-i-am" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On the practice — feeling &quot;I am&quot;</span>
            <span class="quote">Take your attention away from your problem and place it upon just being. Say silently but feelingly, &quot;I am.&quot; Do not condition this awareness, but continue declaring quietly, &quot;I am. I am.&quot; Simply feel that you are faceless and formless, and continue doing so until you feel yourself floating.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On the practice — feeling &quot;I am&quot;</span>
            <span class="back-label">My note</span><p class="note">This is very similar to Joe Dispenza's work — detaching from the body first, becoming no one, nowhere, no thing, no body. Same idea of dropping form and identity before you can become something new.</p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-the-floating-state" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On the floating state</span>
            <span class="quote">A true meditation requires getting into the floating state — a state that completely denies the physical. It is pure relaxation, no reaction to sensory impressions, and in it you become very receptive.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On the floating state</span>
            <p class="attribution">Your Faith Is Your Fortune<span class="byline">Neville Goddard</span></p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-the-floating-state" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On the floating state</span>
            <span class="quote">Once you are there, experiencing the expansion of consciousness — the formless deep of yourself — then you begin to give form to your conception by claiming and feeling yourself to be that which you desire to be. And when you are in that formless deep of yourself, all things appear to be divinely possible.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On the floating state</span>
            <p class="attribution">Your Faith Is Your Fortune<span class="byline">Neville Goddard</span></p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-self-valuation-giants-and-grasshoppers" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On self-valuation — giants and grasshoppers</span>
            <span class="quote">We can be to others only that which we are to ourselves. Therefore, if we value ourselves and begin to feel ourselves to be the giant, a center of power, we automatically change our relationship to the giants — reducing these former monsters to their true place, making them appear to be the helpless grasshoppers.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On self-valuation — giants and grasshoppers</span>
            <p class="attribution">Your Faith Is Your Fortune<span class="byline">Neville Goddard</span></p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-consciousness-as-the-only-savior" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On consciousness as the only savior</span>
            <span class="quote">Consciousness is the one and only savior. The knowledge that I am is God compels man to let all others go, for he finds it impossible to serve two gods. Man cannot accept his awareness, or feeling of being, as God and at the same time believe in another deity.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On consciousness as the only savior</span>
            <p class="attribution">Your Faith Is Your Fortune<span class="byline">Neville Goddard</span></p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-the-vine-and-the-branches" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On the vine and the branches</span>
            <span class="quote">&quot;I am the vine, and ye are the branches.&quot; Consciousness is the vine, and that which you are conscious of being is as the branches that you feed and keep alive. Just as a branch has no life except it be rooted in the vine, so likewise things have no life except you be conscious of them. Just as a branch withers and dies if the sap of the vine ceases to flow toward it, so do things pass away if you take your attention from them — because your attention is the sap of life that sustains the expression of your life.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On the vine and the branches</span>
            <p class="attribution">Your Faith Is Your Fortune<span class="byline">Neville Goddard</span></p>
          </span>
        </span>
      </button>
        <button class="card" data-topic="on-the-claim-i-am-that" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">On the claim — &quot;I am that&quot;</span>
            <span class="quote">If you dare claim it, you will express it.</span>
            <span class="hint">tap to flip</span>
          </span>
          <span class="face back">
            <span class="tag">On the claim — &quot;I am that&quot;</span>

        <button class="card" data-topic="concept-application" aria-label="Flip card">
        <span class="card-inner">
          <span class="face front">
            <span class="tag">Concept → Application</span>

    <script>
      // Flip a card on click.
      document.querySelectorAll('.card').forEach(function (card) {
        card.addEventListener('click', function () {
          card.classList.toggle('is-flipped');
        });
      });

      // Filter cards by topic.
      var chips = document.querySelectorAll('.chip');
      var cards = document.querySelectorAll('.card');
      chips.forEach(function (chip) {
        chip.addEventListener('click', function () {
          chips.forEach(function (c) { c.classList.remove('is-active'); });
          chip.classList.add('is-active');
          var filter = chip.getAttribute('data-filter');
          cards.forEach(function (card) {
            var show = filter === 'all' || card.getAttribute('data-topic') === filter;
            card.classList.toggle('is-hidden', !show);
            card.classList.remove('is-flipped');
          });
          // Hide a book section if it has no visible cards.
          document.querySelectorAll('.book').forEach(function (book) {
            var any = book.querySelectorAll('.card:not(.is-hidden)').length > 0;
            book.style.display = any ? '' : 'none';
          });
        });
      });
    </script>
